<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox and Charts</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <div class ="flex-container">
        <div class="box box1">One..</div>
        <div class="box box2">Two..</div>
        <div class="box box3">Three..</div>
        <div class="box box4">Four..</div>
        <div class="box box5">Five..</div>
        <div class="box box6">Six..</div>
        <div class="box box7">Seven..</div>
    </div>
    
    <div class="navBar">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#start">Start</a></li>
            <li><a href="#go">GO</a></li>
            <li><a href="#back">Back</a></li>
            <li><a href="#bottom">Bottom</a></li>
        </ul>
    </div>

    <div class="dishes">
        <div class="label">Preferred dishes:</div>
        <div class="container">
            <div class="dish pasta" style="flex-basis: 35%;">Pasta: 35%</div>
            <div class="dish pizza" style="flex-basis: 50%;">Pizza: 50%</div>
            <div class="dish burrito" style="flex-basis: 15%;">Burrito: 15%</div>
        </div>
    </div>

    <div class="columns">
        <div class="containerTwo">
            <div class="bar male" style="flex-basis: 25%;">male</div>
            <div class="bar female" style="flex-basis: 20%;">female</div>
        </div>
        <div class="containerTwo">
            <div class="bar male" style="flex-basis: 45%;">male</div>
            <div class="bar female" style="flex-basis: 40%;">female</div>
        </div>
        <div class="containerTwo">
            <div class="bar male" style="flex-basis: 15%;">male</div>
            <div class="bar female" style="flex-basis: 50%;">female</div>
        </div>
        <div class="containerTwo">
            <div class="bar male" style="flex-basis: 5%;">male</div>
            <div class="bar female" style="flex-basis: 60%;">female</div>
        </div>
    </div>
    
</body>
</html>
