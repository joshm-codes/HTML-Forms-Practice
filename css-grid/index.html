<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grids</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="grid-container">
        <div class="grid">E</div>
        <div class="grid">A</div>
        <div class="grid">D</div>
        <div class="grid">G</div>
        <div class="grid">B</div>
        <div class="grid">E</div>

    </div>

    <!--restaurant grid-->
    <div class="restaurant">
        <header>Pizza Place</header>
        <main>Menu</main>
        <footer>About us</footer>
    </div>
    
    <!--12 span grid-->
    <div class="parent">
        <div class="segment twelve">Span 12</div>
        <div class="segment eight">Span 8</div>
        <div class="segment four">Span 4</div>
        <div class="segment six">Span 6</div>
        <div class="segment seven">Span 7</div>
        <div class="segment twelve">Span 12</div>
    </div>
</body>
</html>
