<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Practice</title>

   <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Practicing HTML Forms</h1>
    <div id="firstForm">
    <form>
        <h2>Basic Form</h2>
        <div>
            <label for="firstname">First Name:</label>
            <input type="text" id="firstname" name="firstname" required placeholder="John">
        </div>
        <div>
            <label for="lastname">Last Name:</label>
            <input type="text" id="lastname" name="lastname" required placeholder="Smith">
        </div>
        <div>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required minlength="3">
        </div>
        <div>
            <label for="user-password">Password:</label>
            <input type="password" id="user-password" name="user-password" required minlength="7" maxlength="14">
        </div>
        <div>
            <label for="user-email">Email:</label>
            <input type="email" id="user-email" name="user-email" required minlength="3" placeholder="example@gmail.com" >
        </div>
        <button type="submit">Submit</button>

    </form>
    </div>

   <div id="secondForm">
    
        <h2>Radio Buttons: Book A Table</h2>
            <form method="POST">
                <fieldset id="size">
                    <label>
                        <input type="radio" value="2" name="size"> Two Person Table
                    </label>
                    <label>
                        <input type="radio" value="4" name="size" checked> Four Person Table 
                    </label>
                    <label>
                        <input type="radio" value="6" name="size"> Six Person Table
                    </label>
                </fieldset>
                <fieldset id="location">
                    <label>
                        <input type="radio" value="indoors" name="location" checked> Indoor
                    </label>
                    <label>
                        <input type="radio" value="outdoors" name="location"> Outdoors
                    </label>
                </fieldset>
                <button type="submit">Book Table</button>
            </form>

        <h2>Radio Buttons: Book a Table Two</h2>
            <form method="POST">
                <div>
                    <label for="booking_date">Booking Date:</label>
                    <input type="date" id="booking_date" name="booking_date"> <!--type="date" -> date picker-->
                </div>
                <div>
                    <label for="booking_people">Number of People:</label>
                    <input type="range" id="booking_people" name="booking_people" min="1" max="10" value="4" oninput="this.nextElementSibling.value =this.value"> <!--type="range" ->slider (oninput - JS to adjust slider values)-->
                    <output>4</output><!--default value for slider-->
                </div>
                <div>
                    <label for="booking_location">Location:</label>
                    <input id="booking_location" name="booking_location" list="locations">
                    <datalist id="locations"> <!--autocomplete suggestions-->
                        <option value="Eastside"></option>
                        <option value="Westend"></option>
                        <option value="Dupont Square"></option>
                        <option value="Times Square"></option>
                    </datalist>
                    
                </div>
                <button type="submit">Book Location</button>

                <div>
                    <label for="booking_location-2">New Locations:</label>
                    <select name="locations2" id="locations2">
                        <option value="other">Other</option>
                        <option value="North St">North St.</option>
                        <option value="Sprinfield Ave">Springfield Ave</option>
                        <option value="TryThis St">TryThis St</option>
                        <option value="Last location">Last Location</option>
                    </select>
                </div>
                <button type="submit">Book</button>

                <div id="reviewArea">
                    <label for="review">Please Leave A Review:</label>
                    <textarea name="review" name="review" rows="10" col="30" maxlength="200"></textarea>
                </div>
            </form>

    </div>
    
    
    
</body>
</html>
